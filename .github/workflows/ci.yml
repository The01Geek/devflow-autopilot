name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The default types (opened, synchronize, reopened) are NOT enough for
    # our own bot PRs. The /devflow:implement flow opens a PR as a draft
    # (skills/implement: `gh pr create --draft`), pushes its commits, then
    # toggles ready-for-review (`gh pr ready`). devflow-implement.yml checks
    # out and pushes with the default GITHUB_TOKEN, so GitHub's recursion
    # guard suppresses the `synchronize` event for those commits — and
    # `ready_for_review` is not a default type. Listening only to the
    # defaults meant CI never ran on the bot's HEAD; because `lib + python
    # tests` is a REQUIRED status check, the PR wedged at "Expected —
    # waiting for status" forever. Adding `ready_for_review` makes CI fire
    # on the ready toggle against the current HEAD — the same event
    # devflow-review.yml already keys off (see its `on:` comment) to catch
    # these bot PRs. We do NOT switch to `pull_request_target`: this job
    # runs arbitrary PR code (preflight + the test suite), which under
    # pull_request_target would expose repo secrets to untrusted code.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # The suite is split across concurrent SHARD jobs (issue #877) so wall-clock is
  # bounded by the slowest shard rather than the sum. Each shard runs a subset via
  # lib/test/run-shard.sh — the `monolith` shard runs lib/test/run.sh with the module
  # tier skipped (DEVFLOW_SKIP_SUITE_MODULES=1), and each `modules-*` shard runs its
  # group of registered test modules. The union of the module groups is exactly the
  # registered module set, so NO test is dropped (lib/test/run.sh asserts this against
  # the registry). Each shard writes a small tally directory (passed/failed/skipped +
  # skip detail + failure names) and uploads it; the `lib + python tests` aggregator
  # below downloads them, recombines the accounting, and is the REQUIRED status check.
  shard:
    name: shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Job-scoped so the installing step and the verifying step read ONE literal. Two
    # copies of a pinned version is a coupled pair that drifts on the next bump, and
    # the drift would be silent in the direction that matters: a bumped installer with
    # a stale verifier asserts the old version against the new binary.
    env:
      CLAUDE_CLI_VERSION: 2.1.212
    strategy:
      fail-fast: false
      matrix:
        shard: [monolith, modules-pin, modules-large, modules-rest]
    steps:
      # fetch-depth: 0 (all history for all branches) so refs/remotes/origin/main resolves
      # in the checkout — actions/checkout fetches a single commit by default, under which
      # origin/main does NOT exist, so the #434 stale-prose self-scan in lib/test/run.sh
      # silently self-skipped on every CI run (issue #456). It runs in the monolith shard;
      # history is fetched on every shard uniformly so the checkout config is single-form.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Preflight (dependency check)
        run: bash lib/preflight.sh

      # Install the Claude Code CLI so the #671 `claude plugin validate --strict`
      # gate ARMS instead of self-skipping. Until this step existed the CLI was on no
      # runner, so that gate took its `blocking-gate` skip branch on every CI run. It
      # was the only skip in the run cited here (run 30274021296 @ fb5256b7: "12523
      # passed, 0 failed, 1 skipped") — a dated snapshot, NOT a standing invariant:
      # arming this gate does not drive CI to zero skips, because the #434 stale-prose
      # self-scan skips separately ("working tree dirty") and survives this change.
      # A skip does not fail the suite (issue #456), so the gate was disarmed silently
      # while CI stayed green.
      #
      # The gate is not cosmetic. It stages a plugin-only tree and validates it, and
      # that validation DESCENDS into the skills/ and agents/ trees rather than stopping
      # at the manifest: a malformed-YAML, absent, or empty frontmatter block exits 1.
      # That is asserted executably, not by hand — lib/test/run.sh drives each of those
      # frontmatter shapes against both component trees, each arm preceded by its own
      # positive control, so the claim is a test that can fail rather than a comment
      # that can rot. (Deliberately count-free: an arm count here rots the next time an
      # arm is added — the self-referential-ordinal class CLAUDE.md names.)
      # Validation is auth-free. Measured while authoring this step, on a bench, not a
      # description of this job's configuration: with ANTHROPIC_API_KEY and
      # CLAUDE_CODE_OAUTH_TOKEN unset and HOME redirected to an empty dir, validation
      # still exits 0. (This job redirects nothing — this step's last line writes
      # "$HOME/.local/bin" into GITHUB_PATH.) So the step needs no secret, which matters because this
      # job runs arbitrary PR code (see the `on:` comment on why we do not use
      # pull_request_target). Confirmed in situ: the gate passes in a PR-triggered job
      # that is `contents: read` and carries no secrets.
      #
      # PINNED rather than `stable`/`latest`, for the reason the lint job pins ruff
      # (an unpinned `pip install ruff` picked up 0.16.0, flagged ~645 pre-existing
      # findings repo-wide, and turned that job red on every branch at once): here the
      # CLI *is* the validator, so an unpinned upgrade that adds a new warning would
      # redden this REQUIRED check on an unrelated PR with no repo change. (The
      # ShellCheck pin nearby is a FLOOR — 0.9.0 predates `--extended-analysis` — which
      # is a different argument; ruff's is the one that applies here.) Bump it deliberately, and note the pin is one level shallower than it
      # looks: install.sh itself is refetched unpinned and unchecksummed each run, so
      # the version argument pins the CLI, not the installer. The blast radius is
      # bounded — this job is `contents: read` and holds no secrets — and the verify
      # step below asserts the version actually landed.
      #
      # The gate lives in lib/test/run.sh (the `monolith` shard), but the CLI is
      # installed on EVERY shard uniformly — like the checkout depth above, though for
      # a different reason: that one is uniform to keep the checkout config single-form,
      # this one so a gate that later moves into a module shard does not quietly revert
      # to self-skipping. That uniformity has a real cost worth stating: it puts one
      # network install per shard behind a REQUIRED check, so a claude.ai outage can redden
      # `lib + python tests` via a shard that consumes nothing from the CLI. The retry
      # below absorbs the transient case; a sustained outage fails the check loudly,
      # which is the intended direction for a gate whose whole defect class is failing
      # QUIETLY. Narrow it to `if: matrix.shard == 'monolith'` only if that trade stops
      # being worth it — accepting the silent-revert exposure it reopens.
      - name: Install Claude Code CLI (arms the #671 plugin-validate gate)
        run: |
          # The retry/backoff/terminal-exit logic lives in scripts/retry-with-backoff.sh
          # so the suite can drive each arm; inline, nothing exercised them.
          #
          # `set -o pipefail` inside the command string is load-bearing and NOT
          # redundant: a step with no `shell:` key runs under `bash -e {0}`, which does
          # not set it (only an explicit `shell: bash` gets `-eo pipefail`), and this
          # workflow has no `defaults:` block. Without it a failed download feeds bash
          # an empty script that exits 0, so the install would be recorded as a success.
          # The verify step below would still redden the check, so pipefail is what
          # attributes the failure to the download rather than to a missing binary.
          bash scripts/retry-with-backoff.sh 3 2 \
            'set -o pipefail; curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CLI_VERSION"'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Asserts the version rather than merely printing it, so the pin above is
      # self-verifying: the pin's whole mechanism is one positional argument to a
      # third-party installer, and an installer that ignored or renamed it would
      # otherwise hand us an unpinned CLI while this step still passed. Also the
      # load-bearing detector that the install landed on PATH at all (GITHUB_PATH only
      # takes effect in LATER steps, so this cannot be folded into the step above).
      #
      # The decision logic lives in scripts/assert-cli-version.sh, not inline here, so
      # lib/test/run.sh can drive each arm (empty pin / exact match / prefix rejection).
      # Inline, the whole step could be deleted and the suite would stay green.
      #
      # An empty CLAUDE_CLI_VERSION does NOT make this step vacuous: the helper exits 2
      # on an empty pin, so the check fails closed. It would still leave the INSTALL
      # half unpinned (`bash -s ""` takes the installer's default), which is why run.sh
      # separately pins that the env: key carries a version-SHAPED value (not the exact
      # literal, which would trap every deliberate bump) — that pin is what catches the
      # key being dropped OR emptied.
      - name: Verify the claude CLI resolves on PATH at the pinned version
        run: |
          v="$(claude --version)"
          echo "$v"
          bash scripts/assert-cli-version.sh "$CLAUDE_CLI_VERSION" "$v"

      - name: Run shard (${{ matrix.shard }})
        env:
          DEVFLOW_SHARD_TALLY_DIR: ${{ github.workspace }}/shard-tally-out
        run: bash lib/test/run-shard.sh "${{ matrix.shard }}"

      - name: Upload shard tally
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tally-${{ matrix.shard }}
          path: ${{ github.workspace }}/shard-tally-out
          if-no-files-found: warn

  # The REQUIRED merge-gate status check. Its name (`lib + python tests`) is the exact
  # branch-protection contract — renaming or dropping it silently un-gates merges — so it
  # is preserved here as the aggregator. `if: always()` + the shard-result gate mean a
  # failed, cancelled, or skipped shard fails this job (a skipped required check that
  # auto-passes is the classic un-gating trap). The combine step recombines the aggregate
  # passed/failed/skipped accounting and surfaces the full skip population (issue #456: a
  # skipped check is never laundered into a clean pass), failing closed if a shard's tally
  # is missing or malformed.
  test:
    name: lib + python tests
    needs: [shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download shard tallies
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: tally-*
          path: shard-tallies

      - name: Recombine shard tallies (aggregate pass/fail/skip accounting)
        run: python3 lib/test/shard-tally.py combine --scan shard-tallies --expect 4

      # The branch selection and its user-facing message live in the helper, not
      # inline here, so lib/test/run.sh can drive every arm (success / failure /
      # cancelled / skipped / unestablished) rather than grep-pinning a literal.
      - name: Gate on shard results
        run: bash lib/test/gate-shard-result.sh "${{ needs.shard.result }}"

  lint:
    name: lint (shellcheck + actionlint + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pin ShellCheck instead of using the runner image's (issue #745). Two
      # coupled requirements force this, and BOTH are load-bearing:
      #   1. lib/test/run.sh (>50k lines) cannot be analysed with ShellCheck's
      #      dataflow ("extended analysis") pass on: it allocates ~15 GB and the
      #      16 GB runner is evicted mid-analysis with "The runner has received a
      #      shutdown signal" (observed 6/6 runs across 5 head SHAs, PR #734).
      #      --extended-analysis=false brings it to 1.15 GB / ~10 s. Cost, as
      #      measured on 2026-07-23 against ShellCheck 0.11.0: none on this file
      #      — a chunked A/B of the whole file produced a byte-identical finding
      #      set both ways. (Issue #745 recorded SC2319 x4 dropping corpus-wide
      #      at authoring time; that no longer reproduces under 0.11.0. Both are
      #      past-time snapshots, not invariants — re-measure after an upgrade.)
      #   2. ubuntu-latest (Ubuntu 24.04) ships ShellCheck 0.9.0, which predates
      #      --extended-analysis (added in 0.10.0 — per its release notes; the
      #      runner's tool version is an external fact, observed in PR #734, not
      #      a repo-verified invariant). On 0.9.0 the flag ERRORS, and the
      #      equivalent `# shellcheck extended-analysis=false` directive has no
      #      effect — it is reported as an unknown directive (SC1107) and
      #      ignored — so the lint OOMs exactly as if the flag were absent. Pin
      #      >= 0.10.0 rather than depending on the image's tool version, which
      #      drifts with the runner image. lib/test/run.sh asserts the floor.
      # Installed onto PATH so every ShellCheck step below uses the pinned build.
      - name: Pin ShellCheck (>= 0.10.0, required by --extended-analysis)
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          # pipefail so a failed download (404, rate limit, network) is reported as the
          # curl failure it is, rather than as tar's downstream "not found in archive". The
          # step fails either way — tar exits nonzero on the missing member and `set -e`
          # stops the job — so this is attribution, not the only thing standing between the
          # job and the image's 0.9.0. The flag itself is self-verifying: 0.9.0 rejects
          # --extended-analysis outright, so a wrong binary reddens the run.sh step rather
          # than silently under-linting. `shellcheck --version` below prints for the log; it
          # asserts nothing — the version FLOOR is asserted in lib/test/run.sh.
          set -o pipefail
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version

      # --severity=warning keeps the gate on real issues and drops info/style
      # nags. SC1091 ("can't follow sourced file") is excluded: helpers source
      # each other via ${CLAUDE_SKILL_DIR}-relative paths that don't resolve at
      # lint time. The lib/test gh-stubs are deliberately minimal fixtures, not
      # shipped code, so they're out of scope. Piping into xargs (rather than
      # shellcheck $(...)) avoids the SC2046 word-split this very job would flag.
      - name: ShellCheck (lib + scripts)
        run: |
          git ls-files '*.sh' | grep -v '^lib/test/' \
            | xargs -r shellcheck --severity=warning -e SC1091
          # lib/test/ is excluded above (the gh-stub fixtures are not shipped code), but
          # these lib/test files are shipped code (the sourced harness/renderer/
          # module and the standalone focused runner) rather than fixtures, so
          # they are added explicitly rather than shipping unlinted.
          shellcheck --severity=warning -e SC1091 \
            lib/test/module-harness.sh lib/test/run-module.sh lib/test/summary.sh \
            lib/test/run-shard.sh lib/test/gate-shard-result.sh \
            lib/test/modules/workflow-flight-recorder.sh \
            lib/test/modules/review-and-fix-contract.sh \
            lib/test/modules/create-issue-contract.sh \
            lib/test/modules/capability-profiles.sh \
            lib/test/modules/regenerate-artifacts.sh \
            lib/test/modules/installer-wiring.sh \
            lib/test/modules/harness-python-guards.sh \
            lib/test/modules/prompt-extension-reader.sh \
            lib/test/modules/review-trigger-helpers.sh \
            lib/test/modules/review-stall-backstop.sh \
            lib/test/modules/retrospective-lifecycle.sh \
            lib/test/modules/experiment-records.sh \
            lib/test/cloud-form-layout-test.sh \
            lib/test/path-portability-test.sh

      # lib/test/run.sh is the suite driver — the largest and most-edited shell
      # file in the repo, and the last one brought under the lint (issue #745).
      # It gets its own step (rather than joining the list above) because it is
      # the sole file that needs --extended-analysis=false; see the pin step's
      # comment for why the flag and the >= 0.10.0 pin are both required. This
      # runs on the standard ubuntu-latest runner, and its failure is not tolerated.
      - name: ShellCheck (lib/test/run.sh)
        run: |
          shellcheck --severity=warning -e SC1091 --extended-analysis=false lib/test/run.sh

      # actionlint validates workflow syntax and runs shellcheck over run: blocks.
      # SHELLCHECK_OPTS mirrors the severity policy; SC2034 is excluded because
      # each step's run: block is analysed in isolation, so GitHub-context vars
      # assigned in one block but consumed in another read as "unused".
      - name: actionlint (workflows)
        uses: raven-actions/actionlint@v2
        env:
          SHELLCHECK_OPTS: --severity=warning --exclude=SC2034

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: ruff (python)
        run: |
          # Pin ruff: an unpinned `pip install ruff` picked up 0.16.0 the day it
          # released, whose expanded default ruleset (EXE001/PIE810/SIM102/TRY004/…)
          # flagged ~645 pre-existing findings repo-wide and turned this job red on
          # every branch at once. Pin to a known-green minor so a ruff release is an
          # explicit, reviewable bump rather than a silent tree-wide breakage.
          python3 -m pip install --quiet 'ruff==0.15.*'
          git ls-files '*.py' | xargs -r ruff check
